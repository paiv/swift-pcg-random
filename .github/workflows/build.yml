name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  spm-build:
    name: SPM build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
    - uses: actions/checkout@v4
    - name: Swift version
      run: swift --version
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v --enable-test-discovery

